[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cast-react"
authors = [
    {name = "Jochen Wersdörfer", email = "jochen-castreact@wersdoerfer.de"},
]
version = "0.0.2"
dynamic = ["description"]
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = [
    "blog",
    "podcast",
    "video",
    "audio",
    "react",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "django-cast>=0.2.62",
    "django-vite>=3",
]

[project.urls]
Source = "https://github.com/ephes/cast-react"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.flit.module]
name = "cast_react"

[tool.flit.sdist]
exclude = [
    "node_modules/",
    "example/",
    "tests/",
    ".github/",
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
