{# Error pages render without a blog, the API or the theme bundle. #}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>{% block title %}Something went wrong{% endblock title %}</title>
    {% include "./_appearance_head.html" %}
    <style>
      :root[data-color-scheme="light"] { color-scheme: light; }
      :root[data-color-scheme="dark"] { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
             font: 1.0625rem/1.6 system-ui, sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 34rem; }
      h1 { font: 600 2rem/1.2 Charter, "Bitstream Charter", "Sitka Text", Cambria, serif; margin: 0 0 0.75rem; }
      p { margin: 0 0 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>{% block heading %}Something went wrong{% endblock heading %}</h1>
      <p>{% block message %}{% endblock message %}</p>
      <p><a href="/">Go to the start page</a></p>
    </main>
  </body>
</html>
